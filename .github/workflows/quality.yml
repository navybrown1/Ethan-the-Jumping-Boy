name: Game quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chrome firefox webkit
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:xbrowser:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-test-evidence
          path: boss-analysis/
          if-no-files-found: ignore
