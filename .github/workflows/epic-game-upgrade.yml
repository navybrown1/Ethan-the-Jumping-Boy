name: Epic Game Upgrade

on:
  push:
    branches: [main]
    paths:
      - "scripts/enhance_game.py"
      - ".github/workflows/epic-game-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply gameplay upgrade
        run: python scripts/enhance_game.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified upgrade
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.ts src/App.tsx src/index.css README.md
          git commit -m "feat: checkpoints, power-ups, world bosses, and mobile fire"
          git push origin main

# Trigger marker: verified gameplay upgrade pass 1
